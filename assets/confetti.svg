<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120">
  <rect width="100%" height="100%" fill="transparent" />
  <!-- simple confetti animation -->
  <g id="confetti">
    <rect x="50" y="-20" width="10" height="16" fill="#00ffff">
      <animate attributeName="y" dur="2.6s" values="-30;140" repeatCount="indefinite"/>
      <animate attributeName="x" dur="3s" values="50;200" repeatCount="indefinite"/>
    </rect>
    <rect x="180" y="-10" width="8" height="12" fill="#00c8ff">
      <animate attributeName="y" dur="2.2s" values="-30;140" repeatCount="indefinite"/>
      <animate attributeName="x" dur="3.2s" values="180;360" repeatCount="indefinite"/>
    </rect>
    <rect x="320" y="-15" width="12" height="18" fill="#00f0ff">
      <animate attributeName="y" dur="2.8s" values="-30;140" repeatCount="indefinite"/>
      <animate attributeName="x" dur="3.4s" values="320;520" repeatCount="indefinite"/>
    </rect>
    <rect x="480" y="-25" width="9" height="13" fill="#00ffff">
      <animate attributeName="y" dur="2.4s" values="-30;140" repeatCount="indefinite"/>
      <animate attributeName="x" dur="3s" values="480;640" repeatCount="indefinite"/>
    </rect>
    <rect x="640" y="-18" width="11" height="15" fill="#00c8ff">
      <animate attributeName="y" dur="2.7s" values="-30;140" repeatCount="indefinite"/>
      <animate attributeName="x" dur="3.3s" values="640;820" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
