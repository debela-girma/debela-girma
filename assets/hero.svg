<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#00ffff">
        <animate attributeName="stop-color" values="#00ffff;#00f0ff;#00c8ff;#00ffff" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00c8ff">
        <animate attributeName="stop-color" values="#00c8ff;#00ffff;#00f0ff;#00c8ff" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#07111a" />
  <text x="50%" y="55%" text-anchor="middle" font-family="'Fira Code', monospace" font-size="36" fill="url(#g)" filter="url(#glow)">Debela Girma</text>
  <text x="50%" y="80%" text-anchor="middle" font-family="'Fira Code', monospace" font-size="16" fill="#9be8ff">Full‑Stack Developer • UI/UX Enthusiast</text>
</svg>
